<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Health Clinic</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #eef1ee;
    height: 100%;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #frame {
    position: relative;
    width: 100%;
    max-width: calc(100vh * 1536 / 1024);
    max-height: 100vh;
    aspect-ratio: 1536 / 1024;
  }
  #frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    user-select: none;
    -webkit-user-drag: none;
  }
  .hit {
    position: absolute;
    cursor: pointer;
  }
  .hit:focus {
    outline: none;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <img id="screen" src="assets/step1.jpg" alt="Prime Health Clinic">
      <div id="hitLayer"></div>
    </div>
  </div>

<script>
  // Zones are percentages of the frame (which exactly matches the 1536x1024 PDF page).
  // type: 'next' -> advance to nextIndex ; 'back' -> go to prevIndex ; 'cta' -> open external URL
  const steps = [
    { // index 0 -> Etape 1
      img: 'step1.jpg',
      next: { x0:75.04, y0:88.08, x1:88.24, y1:94.56 },
      back: null
    },
    { // index 1 -> Etape 2
      img: 'step2.jpg',
      next: { x0:75.04, y0:88.46, x1:88.26, y1:95.02 },
      back: { x0:69.54, y0:88.46, x1:73.04, y1:95.02 }
    },
    { // index 2 -> Etape 3
      img: 'step3.jpg',
      next: { x0:74.74, y0:90.54, x1:87.91, y1:97.16 },
      back: { x0:69.24, y0:90.54, x1:72.74, y1:97.16 }
    },
    { // index 3 -> Etape 4
      img: 'step4.jpg',
      next: { x0:70.61, y0:89.38, x1:86.41, y1:96.70 },
      back: { x0:65.11, y0:89.38, x1:68.61, y1:96.70 }
    },
    { // index 4 -> Etape 5
      img: 'step5.jpg',
      next: { x0:70.61, y0:88.92, x1:86.34, y1:96.25 },
      back: { x0:65.11, y0:88.92, x1:68.61, y1:96.25 }
    },
    { // index 5 -> Etape 6
      img: 'step6.jpg',
      next: { x0:75.70, y0:89.34, x1:88.70, y1:96.00 },
      back: { x0:70.20, y0:89.34, x1:73.70, y1:96.00 }
    },
    { // index 6 -> Etape 7
      img: 'step7.jpg',
      next: { x0:74.57, y0:89.76, x1:87.86, y1:96.42 },
      back: { x0:69.07, y0:89.76, x1:72.57, y1:96.42 }
    },
    { // index 7 -> Etape 8 (Terminer)
      img: 'step8.jpg',
      next: { x0:74.83, y0:91.84, x1:88.33, y1:98.04 },
      back: { x0:69.33, y0:91.84, x1:72.83, y1:98.04 }
    },
    { // index 8 -> Prime Health Scan launcher
      img: 'step9.jpg',
      cta:  { x0:53.53, y0:73.45, x1:93.02, y1:81.91 },
      back: { x0:0,     y0:89.5,  x1:16,    y1:99.0 }
    }
  ];

  let current = 0;
  const screenEl = document.getElementById('screen');
  const hitLayer = document.getElementById('hitLayer');
  const CTA_URL = 'prime-health-scan.html';

  function pctStyle(z) {
    return {
      left: z.x0 + '%',
      top: z.y0 + '%',
      width: (z.x1 - z.x0) + '%',
      height: (z.y1 - z.y0) + '%'
    };
  }

  function render() {
    const step = steps[current];
    screenEl.src = step.img;
    hitLayer.innerHTML = '';

    if (step.next) {
      const btn = document.createElement('div');
      btn.className = 'hit';
      Object.assign(btn.style, pctStyle(step.next));
      btn.setAttribute('aria-label', current === 7 ? 'Terminer' : 'Suivant');
      btn.addEventListener('click', () => {
        current = Math.min(current + 1, steps.length - 1);
        render();
      });
      hitLayer.appendChild(btn);
    }

    if (step.cta) {
      const cta = document.createElement('div');
      cta.className = 'hit';
      Object.assign(cta.style, pctStyle(step.cta));
      cta.setAttribute('aria-label', 'Lancer mon Prime Health Scan');
      cta.addEventListener('click', () => {
        window.location.href = CTA_URL;
      });
      hitLayer.appendChild(cta);
    }

    if (step.back) {
      const back = document.createElement('div');
      back.className = 'hit';
      Object.assign(back.style, pctStyle(step.back));
      back.setAttribute('aria-label', 'Retour');
      back.addEventListener('click', () => {
        current = Math.max(current - 1, 0);
        render();
      });
      hitLayer.appendChild(back);
    }
  }

  render();
</script>
</body>
</html>
